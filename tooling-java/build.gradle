allprojects {
    group = 'com.totalcross.tooling'
    version = providers.gradleProperty('toolingVersion').orElse('0.1.0-SNAPSHOT').get()
    repositories {
        mavenCentral()
    }
}

subprojects {
    plugins.withId('maven-publish') {
        publishing {
            repositories {
                maven {
                    name = 'staging'
                    url = providers.gradleProperty('stagingRepo')
                        .map { uri(it) }
                        .orElse(rootProject.layout.buildDirectory.dir('staging-repository'))
                }
            }
        }
    }
}
