plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
}

group = 'com.totalcross'
def pluginVersion = providers.gradleProperty('pluginVersion').orElse('0.1.0-SNAPSHOT')
def toolingVersion = providers.gradleProperty('toolingVersion').orElse('0.1.0-SNAPSHOT')
def releaseMode = providers.gradleProperty('releaseMode').map { it.toBoolean() }.orElse(false)
def toolingRepository = providers.gradleProperty('toolingRepository')
version = pluginVersion.get()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    if (!releaseMode.get()) {
        mavenLocal()
    }
    if (toolingRepository.isPresent()) {
        maven { url = uri(toolingRepository.get()) }
    }
    mavenCentral()
}

dependencies {
    implementation "com.totalcross.tooling:tooling-core:${toolingVersion.get()}"
    implementation "com.totalcross.tooling:tooling-cli:${toolingVersion.get()}"
    implementation "com.totalcross.tooling:tooling-project-conversion:${toolingVersion.get()}"
    testImplementation gradleTestKit()
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

publishing {
    repositories {
        maven {
            name = 'staging'
            url = providers.gradleProperty('stagingRepo')
                    .map { uri(it) }
                    .orElse(layout.buildDirectory.dir('staging-repository'))
        }
    }
}

gradlePlugin {
    plugins {
        application {
            id = 'com.totalcross.application'
            implementationClass = 'com.totalcross.gradle.TotalCrossPlugin'
            displayName = 'TotalCross Gradle ApplicationPlugin'
            description = 'Builds TotalCross applications with the TotalCross SDK.'
        }
        library {
            id = 'com.totalcross.library'
            implementationClass = 'com.totalcross.gradle.TotalCrossLibraryPlugin'
            displayName = 'TotalCross Gradle Library Plugin'
            description = 'Builds TotalCross libraries with the TotalCross SDK.'
        }
    }
}

afterEvaluate {
    publishing.publications.named('pluginMaven', org.gradle.api.publish.maven.MavenPublication) {
        artifactId = 'totalcross-gradle-plugin'
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform {
        excludeTags 'network'
    }
}

tasks.register('sdkSourceNetworkTest', Test) {
    group = 'verification'
    description = 'Checks the GitHub SDK release lookup and S3 fallback without downloading archives.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'network'
    }
}

tasks.named('processResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
